# Production stack on one Linux host: Caddy, the API and PostgreSQL. Labs are not part
# of it: the API creates them through the host's Docker Engine, under runsc, with no
# network. See docs/deployment.md.
#
#   docker compose -p linuxlab-prod -f infra/compose.prod.yml \
#     --env-file <release file from infra/release/build.sh> \
#     --env-file /etc/linuxlab/production.env up -d
#
# Networks: "public" holds only Caddy and is the only one with published ports;
# "edge" (Caddy and the API) and "db" (the API, PostgreSQL and the one-off tasks) are
# internal, so the API and PostgreSQL have no route to the internet.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-database: &database
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://linuxlab:${POSTGRES_PASSWORD:?}@postgres:5432/linuxlab
  # Required by the production settings; tasks never start labs.
  LAB_OCI_RUNTIME: runsc

services:
  caddy:
    image: ${EDGE_IMAGE:?set by the release file}
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      # Certificates and their private keys. Not a cache: keep it and back it up.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      public: {}
      edge:
        ipv4_address: ${CADDY_EDGE_IP:-172.30.1.2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 30s
    logging: *logging

  api:
    image: ${API_IMAGE:?set by the release file}
    # A fixed name and address: `--scale api=2` fails instead of starting a second
    # process (terminals, history order, rate limits and the reaper are in memory).
    container_name: linuxlab-api
    restart: unless-stopped
    <<: *hardening
    tmpfs: [/tmp]
    command:
      - uvicorn
      - --factory
      - linuxlab.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --ws-max-size
      - "65536"
      # X-Forwarded-For is read only on connections from Caddy's address.
      - --proxy-headers
      - --forwarded-allow-ips
      - ${CADDY_EDGE_IP:-172.30.1.2}
      # Lets a lab replacement in progress (up to about 100 s) finish on shutdown.
      - --timeout-graceful-shutdown
      - "120"
      - --no-server-header
    environment:
      <<: *database
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      LAB_IMAGE: ${LAB_IMAGE:?set by the release file}
      LAB_DEPLOYMENT: ${LAB_DEPLOYMENT:?}
      LAB_CAPACITY: ${LAB_CAPACITY:?}
    # The Docker socket is root on the host (docs/threat-model.md). The API runs as
    # uid 10001 and reaches it through the socket's group.
    group_add:
      - "${DOCKER_SOCKET_GID:?}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      edge:
        ipv4_address: ${API_EDGE_IP:-172.30.1.3}
      db: {}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 130s
    logging: *logging

  postgres:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    environment:
      POSTGRES_USER: linuxlab
      POSTGRES_DB: linuxlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      db: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linuxlab -d linuxlab"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 60s
    logging: *logging

  # One-off tasks with the release's API image: migrations and the content sync.
  # Started only by name (`run --rm task ...`, see docs/operations.md), never by `up`.
  # No Docker socket, no Caddy, no internet; the content checkout is mounted read-only
  # by the sync and leaves with its container.
  task:
    image: ${API_IMAGE:?set by the release file}
    profiles: [tasks]
    <<: *hardening
    tmpfs: [/tmp]
    environment:
      <<: *database
    networks:
      db: {}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

networks:
  public:
    ipam:
      config:
        - subnet: ${PUBLIC_SUBNET:-172.30.0.0/24}
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.1.0/24}
  db:
    internal: true
    ipam:
      config:
        - subnet: ${DB_SUBNET:-172.30.2.0/24}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
