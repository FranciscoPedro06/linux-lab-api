name: Runtime

# Runs the Docker integration, isolation and lab lifecycle tests, and the mission
# harness on synthetic missions, under gVisor (runsc), the production runtime. The
# real missions are private and are tested in the content repository. Kept separate from CI because
# it installs a container runtime on the runner.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/linuxlab/**"
      - "migrations/**"
      - "tests/**"
      - "lab-image/**"
      - "infra/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gvisor:
    name: Isolation tests (runsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://linuxlab:linuxlab@localhost:5432/linuxlab
      LINUXLAB_TEST_OCI_RUNTIME: runsc
      LINUXLAB_LAB_IMAGE: linuxlab/lab-base:ci
    steps:
      - uses: actions/checkout@v7

      # The release of infra/release/install-gvisor.sh, its archive checked against the
      # recorded SHA-512; registered with Docker, which is restarted.
      - name: Install gVisor
        run: |
          sudo infra/release/install-gvisor.sh
          sudo systemctl restart docker

      - name: Show container runtimes
        run: |
          runsc --version
          docker info --format 'Default runtime: {{.DefaultRuntime}}'
          docker info --format '{{range $name, $_ := .Runtimes}}Registered runtime: {{$name}}{{"\n"}}{{end}}'

      - name: Smoke test runsc
        run: |
          set -euo pipefail
          output=$(docker run --rm --runtime=runsc --network=none ubuntu:24.04 dmesg)
          echo "$output"
          grep -q gVisor <<<"$output"

      # Started here rather than as a service: installing gVisor restarts Docker,
      # which would stop a service container.
      - name: Start PostgreSQL
        run: |
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER=linuxlab --env POSTGRES_PASSWORD=linuxlab \
            --env POSTGRES_DB=linuxlab postgres:16-alpine
          for _ in $(seq 30); do
            docker exec postgres pg_isready -U linuxlab -d linuxlab && exit 0
            sleep 1
          done
          exit 1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: docker build --tag "$LINUXLAB_LAB_IMAGE" lab-image
      - run: uv run alembic upgrade head

      - name: Run tests under ${{ env.LINUXLAB_TEST_OCI_RUNTIME }}
        run: uv run pytest -m "docker or runsc" -v -rA

  mission-labs:
    name: Mission harness, synthetic missions (runsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://linuxlab:linuxlab@localhost:5432/linuxlab
      LINUXLAB_TEST_OCI_RUNTIME: runsc
      LINUXLAB_LAB_IMAGE: linuxlab/lab-base:ci
    steps:
      - uses: actions/checkout@v7

      # The release of infra/release/install-gvisor.sh, its archive checked against the
      # recorded SHA-512; registered with Docker, which is restarted.
      - name: Install gVisor
        run: |
          sudo infra/release/install-gvisor.sh
          sudo systemctl restart docker

      - name: Show container runtimes
        run: |
          runsc --version
          docker info --format 'Default runtime: {{.DefaultRuntime}}'
          docker info --format '{{range $name, $_ := .Runtimes}}Registered runtime: {{$name}}{{"\n"}}{{end}}'

      - name: Smoke test runsc
        run: |
          set -euo pipefail
          output=$(docker run --rm --runtime=runsc --network=none ubuntu:24.04 dmesg)
          echo "$output"
          grep -q gVisor <<<"$output"

      # Started here rather than as a service: installing gVisor restarts Docker,
      # which would stop a service container.
      - name: Start PostgreSQL
        run: |
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER=linuxlab --env POSTGRES_PASSWORD=linuxlab \
            --env POSTGRES_DB=linuxlab postgres:16-alpine
          for _ in $(seq 30); do
            docker exec postgres pg_isready -U linuxlab -d linuxlab && exit 0
            sleep 1
          done
          exit 1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: docker build --tag "$LINUXLAB_LAB_IMAGE" lab-image
      - run: uv run alembic upgrade head

      - name: Harness in real labs (synthetic missions)
        run: uv run pytest -m "mission_labs and not content" -v -rA

  production-stack:
    name: Production stack end to end (runsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: api
      # The frontend at the tip of its main branch; its commit is printed below.
      - uses: actions/checkout@v7
        with:
          repository: FranciscoPedro06/linux-lab-web
          ref: main
          path: web

      # The release of infra/release/install-gvisor.sh, its archive checked against the
      # recorded SHA-512; registered with Docker, which is restarted.
      - name: Install gVisor
        run: |
          sudo api/infra/release/install-gvisor.sh
          sudo systemctl restart docker

      # The release of infra/ops/age.sh, its archive checked against the recorded SHA-256.
      - name: Install age
        run: |
          api/infra/release/install-age.sh "$RUNNER_TEMP/age"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      # The release of infra/ops/remote.sh, and MinIO with mc for the copies off the host.
      - name: Install rclone, and MinIO for the tests
        run: |
          api/infra/release/install-rclone.sh "$RUNNER_TEMP/rclone"
          api/infra/tests/install-minio.sh "$RUNNER_TEMP/minio"
          echo "$RUNNER_TEMP/rclone" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/minio" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          age --version
          rclone version | head -n 1
          minio --version | head -n 1
          runsc --version
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          echo "web commit: $(git -C web rev-parse HEAD)"

      - name: Build the release
        run: |
          api/infra/release/build.sh --api-repo api --api-sha "$(git -C api rev-parse HEAD)" \
            --web-repo web --web-sha "$(git -C web rev-parse HEAD)" --out "$RUNNER_TEMP/releases"

      - name: Check the stack end to end, entry with its own domain
        run: api/infra/tests/e2e.sh "$(ls "$RUNNER_TEMP"/releases/release-*.env)" --entry direct --runtime runsc

      - name: Check the stack end to end, entry through ngrok (stand-in agent)
        run: api/infra/tests/e2e.sh "$(ls "$RUNNER_TEMP"/releases/release-*.env)" --entry ngrok --runtime runsc

  # The loss of the host (docs/operations.md#disaster-recovery): an origin backed up to
  # MinIO, destroyed, then recovered on a new host that shares nothing with it but
  # MinIO and the keys. The new host is a privileged container running its own Docker
  # Engine (Docker in Docker) with runsc, on a volume of its own: no image, volume,
  # release file, backup or receipt of the origin. Run on the pull request's head
  # commit, with the history the new host clones from.
  disaster-recovery:
    name: Disaster recovery on a new host (runsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: api
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # The frontend at the tip of its main branch; its commit is printed below.
      - uses: actions/checkout@v7
        with:
          repository: FranciscoPedro06/linux-lab-web
          ref: main
          path: web
          fetch-depth: 0

      - name: Install gVisor
        run: |
          sudo api/infra/release/install-gvisor.sh
          sudo systemctl restart docker

      - name: Install age, rclone, and MinIO for the tests
        run: |
          api/infra/release/install-age.sh "$RUNNER_TEMP/tools"
          api/infra/release/install-rclone.sh "$RUNNER_TEMP/tools"
          api/infra/tests/install-minio.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      # The recovery refuses to decrypt into memory that can be swapped to a disk
      # unencrypted, as on a production host; the runner has a swap file.
      - name: Turn swap off
        run: |
          sudo swapoff -a
          test "$(sed 1d /proc/swaps | wc -l)" = 0

      - name: Show versions
        run: |
          age --version
          rclone version | head -n 1
          runsc --version
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          echo "api commit: $(git -C api rev-parse HEAD)"
          echo "web commit: $(git -C web rev-parse HEAD)"
          df -h /

      - name: Build the origin's release
        run: |
          api/infra/release/build.sh --api-repo api --api-sha "$(git -C api rev-parse HEAD)" \
            --web-repo web --web-sha "$(git -C web rev-parse HEAD)" --out "$RUNNER_TEMP/releases"

      - name: Lose the origin, recover on a new host, compare
        run: |
          api/infra/tests/disaster.sh "$(ls "$RUNNER_TEMP"/releases/release-*.env)" \
            --api-repo api --web-repo web --runtime runsc
