name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linuxlab
          POSTGRES_PASSWORD: linuxlab
          POSTGRES_DB: linuxlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linuxlab -d linuxlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://linuxlab:linuxlab@localhost:5432/linuxlab
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - name: Check that migrations downgrade and upgrade again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest
      - name: Integration tests (PostgreSQL)
        run: uv run pytest -m "integration and not docker"

  labs:
    name: Lab integration (Docker, runc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linuxlab
          POSTGRES_PASSWORD: linuxlab
          POSTGRES_DB: linuxlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linuxlab -d linuxlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://linuxlab:linuxlab@localhost:5432/linuxlab
      LINUXLAB_TEST_OCI_RUNTIME: runc
      LINUXLAB_LAB_IMAGE: linuxlab/lab-base:ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: docker build --tag "$LINUXLAB_LAB_IMAGE" lab-image
      - run: uv run alembic upgrade head
      - name: Lab runtime, lifecycle, reaper and terminal tests
        run: uv run pytest -m docker -v -rA

  # Mission harness (docs/missions.md#mission-tests) on synthetic missions only. The
  # real missions are private and are tested in the content repository, never here:
  # code from a pull request must not run next to their solutions.
  missions:
    name: Mission harness, synthetic missions (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linuxlab
          POSTGRES_PASSWORD: linuxlab
          POSTGRES_DB: linuxlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linuxlab -d linuxlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://linuxlab:linuxlab@localhost:5432/linuxlab
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - name: Harness on a FakeRuntime (synthetic missions)
        run: uv run pytest -m missions -v -rA

  mission-labs:
    name: Mission harness, synthetic missions (Docker, runc)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linuxlab
          POSTGRES_PASSWORD: linuxlab
          POSTGRES_DB: linuxlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linuxlab -d linuxlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://linuxlab:linuxlab@localhost:5432/linuxlab
      LINUXLAB_TEST_OCI_RUNTIME: runc
      LINUXLAB_LAB_IMAGE: linuxlab/lab-base:ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: docker build --tag "$LINUXLAB_LAB_IMAGE" lab-image
      - run: uv run alembic upgrade head
      - name: Harness in real labs (synthetic missions)
        run: uv run pytest -m "mission_labs and not content" -v -rA

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target prod --tag linuxlab-api:ci .
      - run: docker build --tag linuxlab/lab-base:ci lab-image
      - name: Check what the images contain (no mission content, tests or secrets)
        run: infra/release/check-images.sh --api linuxlab-api:ci --lab linuxlab/lab-base:ci
      - name: Check that contaminated images are refused
        run: infra/tests/check-images-detects.sh linuxlab-api:ci linuxlab/lab-base:ci
      - name: Validate the Caddy configuration
        run: |
          image=$(sed -n 's/^FROM \(caddy:.*\)$/\1/p' infra/caddy/Dockerfile)
          docker run --rm --network none -v "$PWD/infra/caddy:/etc/caddy:ro" \
            -e SITE_ADDRESS=lab.example.org "$image" \
            sh -c 'caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile &&
              for file in /etc/caddy/Caddyfile /etc/caddy/linuxlab.caddy; do
                caddy fmt "$file" | diff -u "$file" -; done'
      - name: Validate the production Compose file
        run: |
          printf '%s\n' API_IMAGE=a LAB_IMAGE=b EDGE_IMAGE=c SITE_ADDRESS=lab.example.org \
            PUBLIC_ORIGIN=https://lab.example.org POSTGRES_PASSWORD=0 DOCKER_SOCKET_GID=0 \
            LAB_DEPLOYMENT=ci LAB_CAPACITY=1 > "$RUNNER_TEMP/ci.env"
          docker compose -f infra/compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" config --quiet
