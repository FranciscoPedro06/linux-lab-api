schema: 1
slug: leaky-setup
title: Setup que vaza parâmetros
summary: "O setup deixa um processo do aluno com os parâmetros no ambiente."
difficulty: 1
estimated_minutes: 5
status: published

briefing: briefing.md
explanation: briefing.md
objectives:
  - "Existe `~/feito` com `ok`."

environment:
  image: base
  profile: default

params:
  token: { generator: hex, length: 8 }

setup:
  script: setup.sh
  timeout_seconds: 10

validation:
  id: done
  type: file_content
  path: /home/student/feito
  contains: ok

solutions:
  - label: echo
    script: tests/solution-echo.sh
  - label: printf
    script: tests/solution-printf.sh

counterexamples:
  - label: vazio
    script: tests/counter-empty.sh
